server {
    listen 80;
    listen [::]:80;
    server_name tez-pos.uz www.tez-pos.uz;

    # Certbot HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tez-pos.uz www.tez-pos.uz;

    # Certbot o'rnatgandan keyin yo'llar:
    ssl_certificate     /etc/letsencrypt/live/tez-pos.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tez-pos.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location /static/ {
        alias /opt/tezpos_site/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /opt/tezpos_site/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
